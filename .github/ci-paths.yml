# Dependency-aware file groups used by the required pull-request workflow.
rust:
  - "Cargo.lock"
  - "Cargo.toml"
  - "rust-toolchain.toml"
  - "clippy.toml"
  - ".cargo/**"
  - "crates/**/*.rs"
  - "crates/**/Cargo.toml"
  - "xtask/**/*.rs"
  - "xtask/Cargo.toml"

dioxus:
  - "Cargo.lock"
  - "Cargo.toml"
  - "rust-toolchain.toml"
  - "clippy.toml"
  - ".cargo/**"
  - "crates/protocol/**/*.rs"
  - "crates/protocol/Cargo.toml"
  - "crates/wf-observer-sdk/**/*.rs"
  - "crates/wf-observer-sdk/Cargo.toml"
  - "crates/games/warframe/model/**/*.rs"
  - "crates/games/warframe/model/Cargo.toml"
  - "examples/rust/dioxus/src/**"
  - "examples/rust/dioxus/assets/**"
  - "examples/rust/dioxus/public/**"
  - "examples/rust/dioxus/build.rs"
  - "examples/rust/dioxus/Cargo.toml"
  - "examples/rust/dioxus/Dioxus.toml"

bindings_common:
  - "Cargo.lock"
  - "Cargo.toml"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - "boltffi.toml"
  - "crates/protocol/**/*.rs"
  - "crates/protocol/Cargo.toml"
  - "crates/games/warframe/model/**/*.rs"
  - "crates/games/warframe/model/Cargo.toml"
  - "crates/wf-observer-sdk/**/*.rs"
  - "crates/wf-observer-sdk/Cargo.toml"
  - "xtask/**/*.rs"
  - "xtask/Cargo.toml"

jvm:
  - "examples/gradle/wrapper/**"
  - "examples/gradlew"
  - "examples/gradlew.bat"
  - "examples/settings.gradle.kts"
  - "examples/java/**/*.java"
  - "examples/java/**/*.gradle.kts"
  - "examples/kotlin/**/*.kt"
  - "examples/kotlin/**/*.gradle.kts"

csharp:
  - "examples/csharp/**/*.cs"
  - "examples/csharp/**/*.csproj"
  - "examples/csharp/**/*.props"
  - "examples/csharp/**/*.targets"

python:
  - "examples/python/**/*.py"
  - "examples/python/**/pyproject.toml"
  - "examples/python/**/requirements*.txt"

wasm:
  - "boltffi.ci.toml"
  - "examples/browser/**"
  - "examples/typescript/**"
  - "examples/wasm/**"

swift:
  - "boltffi.ci.toml"
  - "examples/swift/**/*.swift"
  - "examples/swift/**/Package.swift"

links:
  - added|modified: "**/*.md"
  - added|modified: "**/*.rs"
  - added|modified: "**/*.toml"
  - added|modified: "**/*.yml"
  - added|modified: "**/*.yaml"
  - added|modified: "**/*.css"

release:
  - ".github/workflows/bindings-release.yml"
  - ".github/workflows/cli-release.yml"
  - "boltffi.release.toml"
  - "crates/wf-observer-cli/Cargo.toml"
  - "xtask/src/release.rs"

packages:
  - ".github/workflows/cli-release.yml"
  - "packaging/**"

workflows:
  - ".github/actions/**"
  - ".github/workflows/**"

# Changing CI policy exercises every component before the new policy can merge.
ci_workflow:
  - ".github/workflows/ci.yml"
  - ".github/ci-paths.yml"

# Changes outside a known runtime group run core Rust CI unless every changed
# file belongs to this explicitly non-runtime set.
non_runtime:
  - "**/*.md"
  - "**/*.css"
  - ".editorconfig"
  - ".gitattributes"
  - ".gitignore"
  - ".github/CODEOWNERS"
  - ".github/dependabot.yml"
  - "LICENSE*"

all:
  - "**"
