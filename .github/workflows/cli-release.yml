name: Release CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Package repositories are shared across releases, so serialize all CLI runs.
  group: release-cli
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Validate CLI release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Verify release commit is on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

      - name: Validate CLI version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          arguments=()
          if [[ -n "$RELEASE_TAG" ]]; then
            arguments+=(--tag "$RELEASE_TAG")
          fi

          version="$(cargo run --locked --quiet -p xtask -- release check-cli "${arguments[@]}")"
          previous_tag="$(
            git for-each-ref \
              --sort=-creatordate \
              --format='%(refname:short)' \
              'refs/tags/cli-v*' \
              | awk -v current="$RELEASE_TAG" '$0 != current { print; exit }'
          )"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build CLI (Linux x64)
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-cli-linux-x64
          save-if: false

      - name: Build CLI
        run: >-
          cargo build --locked --release -p wf-observer-cli
          --target "$TARGET"

      - name: Smoke-test CLI
        shell: bash
        run: |
          binary="target/$TARGET/release/wf-observer"
          "$binary" --version
          "$binary" --help >/dev/null
          "$binary" status

      - name: Package CLI
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          staging="$RUNNER_TEMP/wf-observer-cli"
          asset="wf-observer-$VERSION-$TARGET.tar.gz"
          mkdir --parents "$staging" release-assets
          install --mode=755 "target/$TARGET/release/wf-observer" "$staging/wf-observer"
          install --mode=644 README.md LICENSE-MIT LICENSE-APACHE "$staging"

          epoch="$(git show --no-patch --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@$epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            --create \
            --file=- \
            --directory="$staging" \
            . \
            | gzip --no-name > "release-assets/$asset"

      - name: Upload Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-linux-x64
          path: release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build CLI (Windows x64)
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: >-
        -C target-feature=+crt-static

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add $env:TARGET

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-cli-windows-x64-static-crt
          save-if: false

      - name: Build CLI
        run: >-
          cargo build --locked --release -p wf-observer-cli
          --target $env:TARGET

      - name: Smoke-test CLI
        shell: pwsh
        run: |
          $binary = "target/$env:TARGET/release/wf-observer.exe"
          & $binary --version
          & $binary --help | Out-Null
          & $binary status

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $visualStudio = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$visualStudio) {
            throw "Visual Studio C++ tools were not found"
          }
          $dumpbin = Get-ChildItem `
            "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" `
            | Sort-Object FullName -Descending `
            | Select-Object -First 1
          if ($null -eq $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          $dumpbinPath = $dumpbin.FullName
          $dependencies = & $dumpbinPath /dependents $binary | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed to inspect the CLI executable"
          }
          if ($dependencies -match '(?im)^\s*(?:vcruntime|msvcp)[^\s]*\.dll\s*$') {
            throw "CLI executable depends on the Visual C++ Redistributable"
          }

      - name: Package CLI
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "wf-observer-cli"
          $asset = "wf-observer-$env:VERSION-$env:TARGET.zip"
          New-Item -ItemType Directory -Force -Path $staging, "release-assets" | Out-Null
          Copy-Item "target/$env:TARGET/release/wf-observer.exe" $staging
          Copy-Item "README.md", "LICENSE-MIT", "LICENSE-APACHE" $staging
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath (Join-Path "release-assets" $asset)

      - name: Upload Windows archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-windows-x64
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

  assets:
    name: Assemble CLI release assets
    needs: [metadata, linux, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          mapfile -t archives < <(
            find release-assets -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \) \
              -printf '%f\n' \
              | sort
          )
          if [[ "${#archives[@]}" -ne 2 ]]; then
            echo "Expected two CLI archives, found ${#archives[@]}" >&2
            exit 1
          fi

          cd release-assets
          sha256sum "${archives[@]}" > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  package-metadata:
    name: Render CLI package metadata
    if: ${{ !contains(needs.metadata.outputs.version, '-') }}
    needs: [metadata, assets]
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-release-assets
          path: release-assets

      - name: Verify assets and render metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          linux_asset="wf-observer-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          windows_asset="wf-observer-$VERSION-x86_64-pc-windows-msvc.zip"

          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )

          checksum_for() {
            local filename="$1"
            awk -v filename="$filename" '$2 == filename { print $1 }' \
              release-assets/SHA256SUMS
          }

          linux_sha256="$(checksum_for "$linux_asset")"
          windows_sha256="$(checksum_for "$windows_asset")"
          [[ "$linux_sha256" =~ ^[[:xdigit:]]{64}$ ]]
          [[ "$windows_sha256" =~ ^[[:xdigit:]]{64}$ ]]

          source_archive="$RUNNER_TEMP/wf-observer-source.tar.gz"
          if [[ -n "$RELEASE_TAG" ]]; then
            curl \
              --fail \
              --location \
              --retry 3 \
              --output "$source_archive" \
              "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$RELEASE_TAG.tar.gz"
          else
            git archive \
              --format=tar.gz \
              --prefix="wf-observer-cli-v$VERSION/" \
              HEAD \
              --output="$source_archive"
          fi
          source_sha256="$(sha256sum "$source_archive" | awk '{ print $1 }')"

          bash packaging/render.sh \
            "$VERSION" \
            "$source_sha256" \
            "$linux_sha256" \
            "$windows_sha256" \
            package-metadata

      - name: Upload package metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-package-metadata
          path: package-metadata
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish CLI GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, assets]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-release-assets
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ needs.metadata.outputs.previous_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release '$RELEASE_TAG' already exists" >&2
            exit 1
          fi

          arguments=(
            --verify-tag
            --generate-notes
            --title "WF Observer CLI $VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          if [[ -n "$PREVIOUS_TAG" ]]; then
            arguments+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          gh release create "$RELEASE_TAG" "${assets[@]}" "${arguments[@]}"
      - name: Signal DGit's listener
        continue-on-error: true
        shell: bash
        env:
          DGIT_SIGNAL_SECRET: ${{ secrets.WF_OBSERVER_SIGNAL_SECRET }}
        run: |
          if [[ -z "$DGIT_SIGNAL_SECRET" ]]; then
            echo "::error::WF_OBSERVER_SIGNAL_SECRET is not configured"
            exit 1
          fi

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          if ! http_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $DGIT_SIGNAL_SECRET" \
              "https://listener.denaerium.com/signal/wf-observer-bin"
          )"; then
            echo "::error::could not reach dgit-listener (network/TLS failure)"
            exit 1
          fi

          body="$(cat "$response")"

          if [[ "$http_status" == 2* ]]; then
            echo "Signal accepted (HTTP $http_status): $body"
          else
            echo "::error::signal rejected (HTTP $http_status): $body"
            exit 1
          fi



  publish-aur:
    name: Publish CLI packages to the AUR
    # Remove the false guard when AUR account registration is available again.
    if: >-
      false &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      !contains(needs.metadata.outputs.version, '-')
    needs: [metadata, package-metadata, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: archlinux:base-devel

    steps:
      - name: Install packaging tools
        run: |
          pacman-key --init
          pacman --sync --refresh --sysupgrade --needed --noconfirm git namcap openssh

      - name: Download package metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-package-metadata
          path: package-metadata

      - name: Configure AUR authentication
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

          useradd --create-home publisher
          install --directory --owner=publisher --group=publisher --mode=700 \
            /home/publisher/.ssh

          key_file=/home/publisher/.ssh/aur
          known_hosts=/home/publisher/.ssh/known_hosts
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$known_hosts"

          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{ print $2 }')"
          if [[ "$fingerprint" != "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4" ]]; then
            echo "unexpected aur.archlinux.org SSH host key: $fingerprint" >&2
            exit 1
          fi

          {
            echo "Host aur.archlinux.org"
            echo "  IdentityFile $key_file"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > /home/publisher/.ssh/config

          chmod 600 "$key_file" "$known_hosts" /home/publisher/.ssh/config
          chown --recursive publisher:publisher /home/publisher/.ssh
          runuser -u publisher -- git config --global user.name github-actions[bot]
          runuser -u publisher -- git config --global user.email \
            41898282+github-actions[bot]@users.noreply.github.com

      - name: Validate AUR repositories
        shell: bash
        run: |
          install --directory --owner=publisher --group=publisher /tmp/aur

          for package in wf-observer wf-observer-bin; do
            repository="/tmp/aur/$package"
            runuser -u publisher -- git -c init.defaultBranch=master clone \
              "ssh://aur@aur.archlinux.org/$package.git" \
              "$repository"
            install \
              --owner=publisher \
              --group=publisher \
              --mode=644 \
              "package-metadata/aur/$package/PKGBUILD" \
              "$repository/PKGBUILD"

            # $1 expands in the child shell.
            # shellcheck disable=SC2016
            runuser -u publisher -- bash -c '
              set -euo pipefail
              cd "$1"
              bash -n PKGBUILD
              makepkg --printsrcinfo > .SRCINFO
              namcap PKGBUILD
            ' _ "$repository"
          done

      - name: Push AUR repositories
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for package in wf-observer wf-observer-bin; do
            repository="/tmp/aur/$package"
            runuser -u publisher -- git -C "$repository" add -- PKGBUILD .SRCINFO
            if runuser -u publisher -- git -C "$repository" diff --cached --quiet; then
              echo "$package is already at $VERSION"
              continue
            fi

            runuser -u publisher -- git -C "$repository" commit \
              --message "Update to $VERSION"
            runuser -u publisher -- git -C "$repository" push origin HEAD:master
          done

  publish-scoop:
    name: Publish CLI package to Scoop
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      !contains(needs.metadata.outputs.version, '-')
    needs: [metadata, package-metadata, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Download package metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-package-metadata
          path: package-metadata

      - name: Update Scoop bucket
        id: update-scoop
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          bucket="$RUNNER_TEMP/scoop-bucket"
          git clone --depth 1 https://github.com/OpenGameInterop/scoop-bucket.git "$bucket"
          install --mode=644 \
            package-metadata/scoop/wf-observer.json \
            "$bucket/bucket/wf-observer.json"
          jq --exit-status . "$bucket/bucket/wf-observer.json" >/dev/null

          git -C "$bucket" config user.name github-actions[bot]
          git -C "$bucket" config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C "$bucket" add -- bucket/wf-observer.json
          if git -C "$bucket" diff --cached --quiet; then
            echo "wf-observer is already at $VERSION"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$bucket" commit --message "wf-observer: update to $VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push Scoop bucket
        if: steps.update-scoop.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "SCOOP_BUCKET_TOKEN is not configured" >&2
            exit 1
          fi

          gh auth setup-git
          git -C "$RUNNER_TEMP/scoop-bucket" push origin HEAD
