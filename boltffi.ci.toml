# Pull-request CI needs only the macOS slice used by its runner. Release builds
# continue to use the complete Apple target matrix from boltffi.toml.
[targets.apple]
ios_architectures = []
simulator_architectures = []
macos_architectures = ["arm64"]

# Pull-request packages are discarded after validation, so build WASM with the
# fast CI profile and leave production optimization to the release workflow.
# BoltFFI needs an explicit artifact path when Cargo uses a named profile.
[targets.wasm]
profile = "debug"
artifact_path = "target/wasm32-unknown-unknown/ci/wf_observer_sdk.wasm"

[targets.wasm.optimize]
enabled = false
