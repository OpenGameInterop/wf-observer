[package]
# BoltFFI 0.30.1's C# renderer requires this source package name to also be a
# valid C# identifier, so keep underscores instead of Cargo-style hyphens.
name = "wf_observer_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
boltffi = { workspace = true }
iroh-tickets = { workspace = true }
wf_observer_sdk = { path = "../wf-observer-sdk" }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
# Drives our async API without a Tokio host runtime, matching a foreign executor.
pollster = { workspace = true }

[lints]
workspace = true
