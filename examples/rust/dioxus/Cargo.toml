[package]
name = "example-rust-dioxus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { version = "0.7.10" }
wf_observer_sdk = { path = "../../../crates/wf-observer-sdk" }
iroh-tickets = { workspace = true }
n0-future = { workspace = true }

hotpath = { workspace = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
directories = { workspace = true }

[target.wasm32-unknown-unknown.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
serde_json = { workspace = true }

[features]
# We dont expose Desktop/Web/Mobile features as they have not diverged yet
# Instead prefer using https://crates.io/crates/dioxus-cli with the appropriate target
# ie: dx serve -p example-rust-dioxus --desktop --release

[lints]
workspace = true
